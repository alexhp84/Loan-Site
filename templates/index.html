<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Loan Application Assessment</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
</head>

<body class="bg-gray-900 text-gray-100 min-h-screen p-8">
    <div class="max-w-4xl mx-auto">

        <nav class="flex justify-between items-center mb-6 bg-gray-800 p-4 rounded-lg border border-gray-700 shadow">
            <div class="flex space-x-4">
                <a href="/" class="text-blue-400 font-semibold">Home</a>
                <a href="/dashboard" class="text-gray-300 hover:text-white transition">Model Dashboard</a>
                <a href="/model" class="text-gray-300 hover:text-white transition">Model Details</a>
                <a href="/api" class="text-gray-300 hover:text-white transition">API Status</a>
                <a href="/logs" class="text-gray-300 hover:text-white transition">Application Logs</a>
            </div>
        </nav>

        <div class="bg-gray-800 rounded-lg shadow-lg p-6 border border-gray-700">
            <h1 class="text-2xl font-bold mb-6 border-b border-gray-700 pb-3">Loan Application Assessment</h1>

            <form id="loan-form" class="space-y-4">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">

                    <div>
                        <label class="block text-sm font-medium text-gray-300 mb-1">Person Income</label>
                        <input type="number" name="person_income" required
                               class="w-full bg-gray-700 border border-gray-600 rounded p-2 text-white"
                               placeholder="50000">
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-gray-300 mb-1">Loan Amount</label>
                        <input type="number" name="loan_amnt" required
                               class="w-full bg-gray-700 border border-gray-600 rounded p-2 text-white"
                               placeholder="10000">
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-gray-300 mb-1">Credit History</label>
                        <input type="number" step="0.1" name="cb_person_cred_hist_length" required
                               class="w-full bg-gray-700 border border-gray-600 rounded p-2 text-white"
                               placeholder="5">
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-gray-300 mb-1">Credit Score</label>
                        <input type="number" name="credit_score" required
                               class="w-full bg-gray-700 border border-gray-600 rounded p-2 text-white"
                               placeholder="700">
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-gray-300 mb-1">Home Ownership</label>
                        <select name="person_home_ownership"
                                class="w-full bg-gray-700 border border-gray-600 rounded p-2 text-white">
                            <option value="RENT">RENT</option>
                            <option value="MORTGAGE">MORTGAGE</option>
                            <option value="OWN">OWN</option>
                            <option value="OTHER">OTHER</option>
                        </select>
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-gray-300 mb-1">Previous Loan</label>
                        <select name="previous_loan_defaults_on_file"
                                class="w-full bg-gray-700 border border-gray-600 rounded p-2 text-white">
                            <option value="No">No</option>
                            <option value="Yes">Yes</option>
                        </select>
                    </div>

                </div>

                <button type="submit"
                        class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2 px-4 rounded transition duration-200 mt-4">
                    Submit Application
                </button>
            </form>

            <!-- Loan decision modal -->
            <div id="result-modal"
                 class="hidden fixed inset-0 z-50 flex items-center justify-center bg-black bg-opacity-70 p-4"
                 role="dialog"
                 aria-modal="true"
                 aria-labelledby="result-title">
                <div class="w-full max-w-md bg-gray-800 rounded-xl border border-gray-700 shadow-2xl p-8 text-center">
                    <div id="result-icon"
                         class="mx-auto mb-4 flex h-20 w-20 items-center justify-center rounded-full text-5xl font-bold">
                    </div>
                    <h2 id="result-title" class="text-3xl font-bold mb-3"></h2>
                    <div class="space-y-2 text-sm text-gray-300 mb-6">
                        <p id="result-code"></p>
                        <p id="result-margin"></p>
                    </div>
                    <button type="button" id="close-result"
                            class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2 px-4 rounded transition duration-200"
                            title="Close the loan decision popup">
                        Close
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const form = document.getElementById('loan-form');
        const modal = document.getElementById('result-modal');
        const resultIcon = document.getElementById('result-icon');
        const resultTitle = document.getElementById('result-title');
        const resultCode = document.getElementById('result-code');
        const resultMargin = document.getElementById('result-margin');
        const closeResult = document.getElementById('close-result');

        function closeResultModal() {
            modal.classList.add('hidden');
        }

        closeResult.addEventListener('click', closeResultModal);

        modal.addEventListener('click', function(e) {
            if (e.target === modal) closeResultModal();
        });

        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape' && !modal.classList.contains('hidden')) {
                closeResultModal();
            }
        });

        form.addEventListener('submit', async function(e) {
            e.preventDefault();

            try {
                const response = await fetch('/margin', {
                    method: 'POST',
                    body: new FormData(this)
                });

                const result = await response.json();

                if (result.status === 'success') {
                    const predictionCode = Number(result.prediction_code);

                    if (predictionCode !== 0 && predictionCode !== 1) {
                        throw new Error(
                            `Unexpected prediction code returned by the model: ${result.prediction_code}`
                        );
                    }

                    const approved = predictionCode === 1;

                    resultIcon.textContent = approved ? '✓' : '✕';
                    resultIcon.className =
                        `mx-auto mb-4 flex h-20 w-20 items-center justify-center rounded-full text-5xl font-bold ${
                            approved
                                ? 'bg-green-900 text-green-400 border-2 border-green-500'
                                : 'bg-red-900 text-red-400 border-2 border-red-500'
                        }`;

                    resultTitle.textContent = approved ? 'Loan Approved' : 'Loan Denied';
                    resultTitle.className =
                        `text-3xl font-bold mb-3 ${approved ? 'text-green-400' : 'text-red-400'}`;

                    resultCode.textContent =
                        `Prediction Code: ${predictionCode} (${approved ? 'Approved' : 'Denied'})`;
                    resultMargin.textContent =
                        `Decision Margin: ${Number(result.margin).toFixed(4)}`;
                } else {
                    resultIcon.textContent = '!';
                    resultIcon.className =
                        'mx-auto mb-4 flex h-20 w-20 items-center justify-center rounded-full text-5xl font-bold bg-red-900 text-red-400 border-2 border-red-500';
                    resultTitle.textContent = 'Assessment Error';
                    resultTitle.className = 'text-3xl font-bold mb-3 text-red-400';
                    resultCode.textContent = result.message || 'Unable to assess the application.';
                    resultMargin.textContent = '';
                }

                modal.classList.remove('hidden');
                closeResult.focus();

            } catch (err) {
                resultIcon.textContent = '!';
                resultIcon.className =
                    'mx-auto mb-4 flex h-20 w-20 items-center justify-center rounded-full text-5xl font-bold bg-red-900 text-red-400 border-2 border-red-500';
                resultTitle.textContent = 'Connection Error';
                resultTitle.className = 'text-3xl font-bold mb-3 text-red-400';
                resultCode.textContent = 'Failed to connect to backend server.';
                resultMargin.textContent = '';

                modal.classList.remove('hidden');
                closeResult.focus();
            }
        });
    </script>
</body>
</html>
